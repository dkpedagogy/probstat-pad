<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHA-256 암호 해시 생성</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;max-width:620px;margin:40px auto;padding:0 18px;color:#17213a}label{display:block;font-weight:700;margin:16px 0 7px}input,button,output{font:inherit;min-height:44px;padding:9px;border:1px solid #b9c3d5;border-radius:8px}input{width:100%}button{margin-top:16px;background:#243a73;color:#fff;cursor:pointer}output{display:block;margin-top:16px;word-break:break-all;min-height:64px;background:#f1f4fa}p{color:#59657c}</style></head>
<body><h1>SHA-256 암호 해시 생성</h1><p>입력값은 서버로 전송하지 않고 브라우저에서 처리한다.</p><label for="secret">암호</label><input id="secret" type="password" autocomplete="off"><button id="make">SHA-256 hex 생성</button><output id="result" aria-live="polite"></output><script>document.querySelector('#make').addEventListener('click',async()=>{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.querySelector('#secret').value));document.querySelector('#result').textContent=Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')});</script></body>
</html>
