<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0E2C78">
  <link rel="manifest" href="manifest.webmanifest">
  <title>확률과 통계 필기 학습</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #F2F4F6;
      --panel: #FFFFFF;
      --panel2: #F7F8FA;
      --line: #E5E8EB;
      --ink: #191F28;
      --muted: #6B7684;
      --primary: #0E2C78;
      --primary-strong: #0A2160;
      --primary-soft: #E7ECF8;
      --primary-text-on: #FFFFFF;
      --good: #1B7F4C;
      --bad: #D0342C;
      --hard: #B45309;
      --focus: #0E2C78;
      --shadow: 0 6px 20px rgba(25,31,40,.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #101418;
        --panel: #17191D;
        --panel2: #1F2329;
        --line: #2A2F36;
        --ink: #E9ECF1;
        --muted: #9AA3AE;
        --primary: #3B5BC6;
        --primary-strong: #304AA4;
        --primary-soft: #252F55;
        --primary-text-on: #FFFFFF;
        --focus: #91A7FF;
        --shadow: 0 6px 20px rgba(0,0,0,.22);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, "Pretendard", sans-serif; overscroll-behavior: none; }
    body { font-size: 16px; }
    button, input, select { font: inherit; }
    button { min-width: 44px; min-height: 44px; border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; background: var(--panel); color: var(--ink); cursor: pointer; transition: background-color .16s ease, border-color .16s ease, transform .16s ease; }
    button:hover { background: var(--panel2); }
    button:active { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .primary { background: var(--primary); color: var(--primary-text-on); border-color: var(--primary); font-weight: 700; }
    .primary:hover { background: var(--primary-strong); }
    .secondary { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
    .danger { color: var(--bad); }
    .quiet { color: var(--muted); font-size: 13px; }
    .hidden { display: none !important; }
    .app-shell { min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .screen { min-height: 100vh; }
    .center-screen { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .auth-card { width: min(440px, 100%); padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .auth-card h1 { margin: 0 0 28px; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -.02em; }
    .field { display: grid; gap: 8px; margin: 16px 0; }
    .field label { font-size: 13px; color: var(--muted); font-weight: 700; }
    .field input, .field select, .request-input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 9px 12px; }
    .error { min-height: 24px; color: var(--bad); font-size: 13px; }
    .auth-card form > .primary { width: 100%; margin-top: 8px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 14px; background: var(--primary); display: grid; place-items: center; }
    .brand-mark svg { width: 27px; height: 27px; }
    .brand h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; }
    .topbar { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
    .topbar .brand { margin: 0; flex: 1; }
    .topbar .brand-mark { width: 34px; height: 34px; border-radius: 12px; }
    .topbar .brand-mark svg { width: 22px; height: 22px; }
    .topbar h1 { font-size: 16px; }
    .main-content { max-width: 1180px; margin: auto; padding: 28px 20px; }
    .list-intro { margin-bottom: 28px; }
    .list-intro h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -.02em; }
    .list-intro p { margin: 0; color: var(--muted); font-size: 16px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin: 0 -20px 22px; padding: 0 20px 2px; overflow: hidden; }
    .toolbar .field { margin: 0; min-width: 190px; flex: 0 0 auto; }
    .toolbar .field label { display: block; margin-bottom: 6px; }
    .toolbar select { border-radius: 999px; padding-left: 16px; padding-right: 34px; }
    .toolbar > button { flex: 0 0 auto; white-space: nowrap; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; overflow: hidden; }
    .tab { border: 0; border-radius: 999px; background: transparent; color: var(--muted); white-space: nowrap; }
    .tab[aria-selected=true] { color: var(--primary-text-on); background: var(--primary); font-weight: 700; }
    .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .item-card { width: 100%; min-height: 148px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); text-align: left; }
    .item-card:hover { border-color: var(--primary); }
    .item-card h3 { margin: 0 0 10px; font-size: 16px; line-height: 1.4; font-weight: 700; }
    .item-meta { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .badge { display: inline-flex; align-items: center; min-height: 28px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .badge.good { color: var(--good); }
    .badge.bad { color: var(--bad); }
    .badge.hard { color: var(--hard); }
    .empty { padding: 32px; text-align: center; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 18px; }
    .footer-credit { text-align: center; color: var(--muted); font-size: 13px; padding: 34px 0 8px; }
    .status-corner { position: fixed; right: 12px; top: 62px; z-index: 20; color: var(--muted); font-size: 13px; background: color-mix(in srgb, var(--panel) 90%, transparent); padding: 4px 8px; border-radius: 999px; }
    :root { --solve-top-height: 52px; --solve-controls-space: 148px; }
    .solve-shell { min-height: 100vh; display: block; }
    .solve-top { position: fixed; inset: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: var(--solve-top-height); padding: 4px 12px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 25; }
    .solve-title { flex: 1; min-width: 0; }
    .solve-title strong, .solve-title span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .solve-title strong { font-size: 16px; }
    .solve-title span { margin-top: 2px; color: var(--muted); font-size: 13px; }
    .timer { color: var(--primary); font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    .solve-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; min-height: 100vh; padding-top: var(--solve-top-height); padding-bottom: var(--solve-controls-space); }
    .question-panel, .writing-panel { min-width: 0; position: relative; }
    .question-panel { background: var(--panel2); border-right: 1px solid var(--line); }
    .question-panel.sticky { position: sticky; top: var(--solve-top-height); align-self: start; max-height: calc(100vh - var(--solve-top-height) - var(--solve-controls-space)); }
    .question-viewport { position: relative; display: block; padding: 16px; touch-action: pan-y; }
    .question-image { width: 100%; height: auto; max-width: none; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; background: #fff; box-shadow: var(--shadow); }
    .question-hint { position: absolute; left: 16px; bottom: 12px; padding: 5px 9px; border-radius: 999px; background: color-mix(in srgb, var(--panel) 90%, transparent); color: var(--muted); font-size: 13px; pointer-events: none; }
    .writing-panel { background: var(--panel); }
    .canvas-wrap { background: repeating-linear-gradient(0deg, transparent 0 31px, color-mix(in srgb, var(--line) 32%, transparent) 32px), repeating-linear-gradient(90deg, transparent 0 31px, color-mix(in srgb, var(--line) 24%, transparent) 32px); touch-action: pan-y; }
    .writing-canvas { display: block; width: 100%; height: 720px; touch-action: pan-y; }
    .solve-controls { position: fixed; inset: auto 0 0; z-index: 24; padding-bottom: env(safe-area-inset-bottom); background: var(--panel); box-shadow: 0 -4px 16px rgba(25,31,40,.08); }
    .tool-row, .answer-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--panel); }
    .tool-row { min-height: 60px; }
    .tool-toggle { display: none; flex: 0 0 auto; border-radius: 999px; }
    .tool-options { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tool-row button { min-height: 44px; padding: 6px 12px; border-radius: 999px; }
    .tool-row button[aria-pressed=true] { box-shadow: inset 0 0 0 2px var(--primary); background: var(--primary-soft); }
    .swatch { width: 44px; padding: 0; border-radius: 999px; }
    .swatch[data-color="#161b2a"] { background: #161b2a; }
    .swatch[data-color="#1e63d6"] { background: #1e63d6; }
    .swatch[data-color="#c83232"] { background: #c83232; }
    .answer-row { padding: 10px; min-height: 68px; }
    .answer-label { margin-right: 2px; color: var(--muted); font-size: 13px; }
    .choice-button { width: 48px; height: 48px; padding: 0; border-radius: 999px; }
    .choice-button[aria-pressed=true] { background: var(--primary); color: var(--primary-text-on); border-color: var(--primary); }
    .answer-input { width: 130px; min-height: 44px; border: 1px solid var(--line); border-radius: 14px; padding: 9px; background: var(--panel); color: var(--ink); }
    .result-shell { min-height: 100dvh; background: var(--bg); }
    .result-flow { width: min(100%, 1040px); margin: 0 auto; padding: 20px; }
    .result-panel { width: 100%; margin: 64px 0 0; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .result-heading { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .result-heading h2 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
    .result-correct, .result-wrong { font-size: 16px; font-weight: 700; }
    .result-correct { color: var(--good); }
    .result-wrong { color: var(--bad); }
    .bar-row { display: grid; grid-template-columns: 24px 1fr 52px; gap: 8px; align-items: center; margin: 9px 0; font-size: 13px; }
    .answer-row-mark > span { font-weight: 700; }
    .bar-track { height: 10px; overflow: hidden; border-radius: 999px; background: var(--panel2); }
    .bar-fill { height: 100%; background: #8A94A6; }
    .bar-fill.answer { background: var(--primary); }
    .bar-fill.chosen-wrong { background: var(--bad); }
    .result-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    .rating-label { width: 100%; margin-right: 3px; color: var(--muted); font-size: 13px; }
    .rating-button { border-radius: 999px; }
    .rating-button[aria-pressed=true] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    .notice { margin: 8px 0; color: var(--hard); font-size: 13px; }
    .solution-box { margin-top: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; }
    .solution-box img { display: block; width: 100%; touch-action: none; }
    .request-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }
    .request-row .request-input { min-width: 0; }
    .request-row #nextItem { grid-column: 1 / -1; width: 100%; }
    .notes-details { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .notes-details summary { padding: 13px 14px; cursor: pointer; color: var(--primary); font-weight: 700; }
    .notes-snapshot-wrap { padding: 12px; background: var(--panel2); border-top: 1px solid var(--line); touch-action: pan-y; }
    .notes-snapshot { display: block; width: 100%; height: auto; background: #fff; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.45); }
    .modal { width: min(440px, 100%); padding: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .modal h2 { margin: 0 0 16px; font-size: 22px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .inline-check { display: flex; align-items: center; gap: 8px; min-height: 44px; }
    .inline-check input { width: 18px; height: 18px; }
    .noscript { padding: 20px; color: var(--bad); }
    .today-hero { max-width: 720px; margin: 0 auto 24px; padding: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); text-align: center; }
    .today-hero h2 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.03em; }
    .today-hero p { margin: 0 0 24px; color: var(--muted); }
    .session-length { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--muted); font-size: 14px; }
    .session-length select { min-height: 44px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); padding: 8px 34px 8px 14px; }
    .start-session { display: block; width: min(360px, 100%); min-height: 58px; margin: 0 auto; border-radius: 16px; font-size: 19px; }
    .today-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 720px; margin: 0 auto 18px; }
    .summary-stat { padding: 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
    .summary-stat strong { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
    .summary-stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
    .direct-link { display: block; width: fit-content; margin: 12px auto 0; border: 0; background: transparent; color: var(--primary); font-size: 14px; }
    .direct-link:hover { background: transparent; text-decoration: underline; }
    .solve-progress { min-width: 54px; color: var(--primary); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; }
    .report-wrap { max-width: 1180px; margin: auto; padding: 28px 20px 48px; }
    .report-header { margin-bottom: 24px; }
    .report-header h2 { margin: 0 0 8px; font-size: 24px; }
    .report-header p { margin: 0; color: var(--muted); }
    .report-section { margin: 18px 0; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    .report-section h3 { margin: 0 0 14px; font-size: 17px; }
    .report-summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .report-stat { padding: 12px; background: var(--panel2); border-radius: 12px; }
    .report-stat strong { display: block; font-size: 20px; }
    .report-stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .table-wrap { overflow: hidden; }
    .report-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 13px; }
    .report-table th, .report-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .report-table th { color: var(--muted); font-weight: 700; white-space: nowrap; }
    .report-table .good { color: var(--good); font-weight: 700; }
    .report-table .bad { color: var(--bad); font-weight: 700; }
    .report-table .hard { color: var(--hard); font-weight: 700; }
    .wrong-list { display: grid; gap: 14px; }
    .wrong-card { display: grid; grid-template-columns: minmax(180px, 300px) 1fr; gap: 16px; padding: 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; }
    .wrong-card > img { width: 100%; max-height: 250px; object-fit: contain; background: #fff; border-radius: 10px; }
    .wrong-card h4 { margin: 0 0 8px; font-size: 15px; }
    .wrong-card p { margin: 6px 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .wrong-card details { margin-top: 10px; }
    .wrong-card details summary { cursor: pointer; color: var(--primary); font-size: 13px; font-weight: 700; }
    .wrong-card details img { display: block; width: 100%; margin-top: 8px; background: #fff; border-radius: 8px; }
    .material-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .material-card { padding: 14px; background: var(--panel2); border-radius: 14px; }
    .material-card.priority { border: 2px solid var(--primary); }
    .material-card h4 { margin: 0 0 8px; font-size: 15px; }
    .material-card ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .priority-note { margin: -4px 0 14px; color: var(--primary); font-size: 14px; font-weight: 700; }
    .report-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; }
    @media (max-width: 760px) {
      .today-hero { padding: 26px 18px; }
      .today-hero h2 { font-size: 24px; }
      .today-summary { gap: 8px; }
      .summary-stat { padding: 12px 6px; }
      .summary-stat strong { font-size: 20px; }
      .report-summary-grid { grid-template-columns: repeat(2, 1fr); }
      .wrong-card { grid-template-columns: 1fr; }
    }

    @media (orientation: portrait) {
      :root { --solve-controls-space: 164px; }
      .solve-body { display: block; min-height: 100vh; touch-action: pan-y; }
      .question-panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .question-panel.sticky { position: static; max-height: none; }
      .question-viewport { padding: 12px; touch-action: pan-y; }
      .question-image { box-shadow: none; }
      .question-hint { position: sticky; left: auto; bottom: auto; display: block; width: fit-content; margin: 8px 0 0; }
      .writing-panel { min-height: 0; }
      .canvas-wrap { min-height: 220px; touch-action: pan-y; }
      .writing-canvas { touch-action: pan-y; }
      .tool-toggle { display: inline-flex; }
      .tool-options { display: none; width: 100%; }
      .solve-controls.tools-expanded .tool-options { display: flex; }
      .tool-row { flex-wrap: nowrap; overflow: hidden; }
      .solve-controls.tools-expanded .tool-row { flex-wrap: wrap; }
      .solve-controls.tools-expanded .tool-toggle { width: 100%; }
      .solve-title strong { font-size: 13px; }
      .timer { font-size: 13px; }
      .main-content { padding: 24px 14px; }
      .toolbar { margin-left: -14px; margin-right: -14px; padding-left: 14px; padding-right: 14px; }
      .result-flow { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<noscript><div class="noscript">JavaScript가 필요합니다.</div></noscript>
<div id="app" class="app-shell"></div>
<div id="statusCorner" class="status-corner" aria-live="polite">저장 준비</div>
<script src="config.js"></script>
<script>
(function(){
  'use strict';const LOCK_KEY='probstat_pad_lock';function lockState(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}')}catch(_){return{}}}function lockRemaining(){const s=lockState();return Math.max(0,Math.ceil(((s.until||0)-Date.now())/1000))}function lockFail(){const s=lockState();const fails=(s.fails||0)+1;const delay=fails>=3?Math.min(3600,Math.pow(2,fails-2)):0;localStorage.setItem(LOCK_KEY,JSON.stringify({fails,until:Date.now()+delay*1000}));return delay}function lockReset(){localStorage.removeItem(LOCK_KEY)}
  const CONFIG=window.APP_CONFIG||{};
  const DEBUG=new URLSearchParams(location.search).get('debug')==='1';
  const UNITS=['전체','여러가지 순열','중복조합','이항정리','확률의 뜻과 활용','조건부확률'];
  const STUDY_UNITS=UNITS.slice(1);
  const STUDY_MATERIALS={
    '여러가지 순열':['원순열은 회전하여 같은 배열을 하나로 보는 순열이다.','서로 다른 n개를 원형으로 배열하는 수는 (n-1)!이다.','중복순열은 n개에서 중복을 허용하여 r개를 택해 나열하는 경우의 수이다.','중복순열은 nΠr = n^r이다.','같은 것이 있는 순열은 전체 n개 중 같은 것이 p, q개 있을 때 n!/(p!q!...)이다.','함수의 개수는 정의역의 각 원소가 가질 수 있는 값의 수를 곱해 센다.','흔한 실수: 원순열에서 회전만 같은 경우와 뒤집기도 같은 경우를 구분하지 않는다.'],

  function submitAnswer(){const value=selectedAnswer();if(value==null){setStatus('답을 입력해야 합니다.');return}const correct=String(value)===String(state.current.answer);state.currentRecord.answer={value,correct,submitted_at:nowISO()};state.currentRecord.elapsed_ms=Math.max(0,Date.now()-state.openEpoch);if(!state.currentRecord.learning_before_state)state.currentRecord.learning_before_state=clone(itemState(state.current));pushEvent('submit',{value,correct});state.currentRecord.stuck=computeStuck(state.currentRecord);finalizeLearningState();recordProfileResult(state.current,state.currentRecord);stopTimer();persistCurrent(true);renderResultScreen();syncNow()}
  function renderResult(){const item=state.current,r=state.currentRecord;const answerLabel=item.type==='객관식'?'정답 '+item.answer+'번 · 학생 답 '+r.answer.value+'번':'정답 '+item.answer+' · 학생 답 '+r.answer.value;const nextLabel=state.sessionRun&&state.sessionIndex+1>=state.sessionRun.queue.length?'보고서 보기':'다음 문항';const panel=$('#resultPanel');panel.classList.remove('hidden');panel.innerHTML='<div class="result-heading"><div><h2>제출 결과</h2><div class="'+(r.answer.correct?'result-correct':'result-wrong')+'">'+(r.answer.correct?'정답':'오답')+' · '+esc(answerLabel)+'</div></div><span class="badge '+(r.answer.correct?'good':'bad')+'">'+formatSeconds(r.elapsed_ms)+'</span></div><div id="choiceBars"></div><div class="result-actions"><span class="rating-label">난이도 자기평가</span><button class="rating-button" data-rating="easy" aria-pressed="'+(r.rating==='easy')+'">쉬웠음</button><button class="rating-button" data-rating="normal" aria-pressed="'+(r.rating==='normal')+'">보통</button><button class="rating-button" data-rating="hard" aria-pressed="'+(r.rating==='hard')+'">어려웠음</button><button id="solutionBtn" class="secondary">EBS 해설 보기</button></div><div id="ratingNotice"></div><div id="solutionBox" class="solution-box hidden"><img id="solutionImage" data-secure-path="'+esc(item.solution||'')+'" alt="'+esc(item.exam_label+' '+item.no+'번 해설 이미지')+'"></div><details id="notesDetails" class="notes-details"><summary>내 필기 보기</summary><div class="notes-snapshot-wrap"><canvas id="notesSnapshot" class="notes-snapshot"></canvas></div></details><div class="request-row"><input id="requestText" class="request-input" maxlength="300" placeholder="유사문제 요청" value="'+esc(r.request_text||'')+'"><button id="requestSave">저장</button><button id="nextItem" class="primary">'+nextLabel+'</button></div>';
    const bars=$('#choiceBars');if(item.choices){Object.keys(item.choices).sort((a,b)=>Number(a)-Number(b)).forEach(k=>{const row=document.createElement('div');const chosen=String(r.answer.value)===k;row.className='bar-row '+(String(item.answer)===k?'answer-row-mark':'');row.innerHTML='<span>'+esc(k)+'</span><div class="bar-track"><div class="bar-fill '+(String(item.answer)===k?'answer ':'')+(chosen&&!r.answer.correct?'chosen-wrong':'')+'" style="width:'+Number(item.choices[k])+'%"></div></div><span>'+Number(item.choices[k]).toFixed(1)+'%</span>';bars.appendChild(row)});if(item.correct_rate!=null){const p=document.createElement('div');p.className='quiet';p.textContent='정답률 '+item.correct_rate+'% (메가스터디 확통 응시자, 선지 비율은 EBSi 응시자 기준)';bars.appendChild(p)}}else{bars.innerHTML='<p class="quiet">선택 비율 자료 없음'+(item.correct_rate!=null?' · 정답률 '+item.correct_rate+'% (메가스터디 확통 응시자, 선지 비율은 EBSi 응시자 기준)':'')+'</p>'}
    $$('.rating-button').forEach(b=>b.addEventListener('click',()=>{r.rating=b.dataset.rating;pushEvent('rating',{rating:r.rating});finalizeLearningState();persistCurrent(true);$$('.rating-button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#ratingNotice').textContent=(!r.answer.correct||r.rating==='hard')?'오답 또는 어려움 문항으로 노트에 자동 저장됩니다.':''}));$('#solutionBtn').addEventListener('click',openSolution);$('#requestSave').addEventListener('click',saveRequest);$('#nextItem').addEventListener('click',nextItem);setupNotesSnapshot();if(r.request_text)$('#ratingNotice').textContent=(!r.answer.correct||r.rating==='hard')?'오답 또는 어려움 문항으로 노트에 자동 저장됩니다.':''}
  function setupNotesSnapshot(){const details=$('#notesDetails'),canvas=$('#notesSnapshot');if(!details||!canvas)return;const draw=()=>{const wrap=canvas.parentElement;if(!wrap)return;const targetWidth=Math.max(1,wrap.clientWidth-24),sourceWidth=Math.max(1,state.snapshotSourceWidth||targetWidth),scale=targetWidth/sourceWidth,dpr=Math.max(1,window.devicePixelRatio||1);canvas.style.width=targetWidth+'px';canvas.style.height=Math.round(state.canvasHeight*scale)+'px';canvas.width=Math.round(targetWidth*dpr);canvas.height=Math.round(state.canvasHeight*scale*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.clearRect(0,0,sourceWidth,state.canvasHeight);state.currentRecord.strokes.forEach(stroke=>drawStroke(ctx,stroke))};details.addEventListener('toggle',()=>{if(details.open)draw()});if(details.open)draw()}
  function openSolution(){const r=state.currentRecord;r.solution_opened_at=r.solution_opened_at||nowISO();pushEvent('solution_open',{before_submit:false});updateProfileFromRecord(state.current,r);persistCurrent(true);const box=$('#solutionBox');if(box){box.classList.remove('hidden');secureImage(state.current.solution,$('#solutionImage'));setupSolutionGestures('#solutionImage')} }
  function saveRequest(){const text=$('#requestText').value.trim();state.currentRecord.request_text=text;pushEvent('request_save',{length:text.length});updateProfileFromRecord(state.current,state.currentRecord);persistCurrent(true);setStatus('저장됨')}
  function nextItem(){saveRequest();if(state.sessionRun){finishSessionEntry();if(state.sessionIndex+1<state.sessionRun.queue.length){openSessionItem(state.sessionIndex+1)}else finishStudySession()}else{const idx=state.items.findIndex(i=>i.item_id===state.current.item_id);closeCurrent();state.current=null;state.currentRecord=null;openItem(state.items[(idx+1)%state.items.length])}}
  function setupImageGestures(){const v=$('#questionViewport'),img=$('#questionImage');if(!v||!img)return;const update=()=>{img.style.transform='translate('+state.imageTransform.x+'px,'+state.imageTransform.y+'px) scale('+state.imageTransform.scale+')'};v.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;v.setPointerCapture(e.pointerId);state.imagePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.imagePointers.size===1)state.imageStart={...state.imageTransform,lastX:e.clientX,lastY:e.clientY};else state.imageStart={...state.imageTransform,dist:imageDistance()}});v.addEventListener('pointermove',e=>{if(!state.imagePointers.has(e.pointerId))return;state.imagePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(state.imagePointers.size===1){state.imageTransform.x=state.imageStart.x+(e.clientX-state.imageStart.lastX);state.imageTransform.y=state.imageStart.y+(e.clientY-state.imageStart.lastY)}else{const d=imageDistance();state.imageTransform.scale=Math.max(.5,Math.min(4,state.imageStart.scale*d/(state.imageStart.dist||d)))}update()});['pointerup','pointercancel'].forEach(type=>v.addEventListener(type,e=>{state.imagePointers.delete(e.pointerId);if(state.imagePointers.size===0)pushEvent('zoom',{scale:Math.round(state.imageTransform.scale*100)/100,x:Math.round(state.imageTransform.x),y:Math.round(state.imageTransform.y)})}));v.addEventListener('wheel',e=>{e.preventDefault();state.imageTransform.scale=Math.max(.5,Math.min(4,state.imageTransform.scale*(e.deltaY<0?1.1:.9)));update();pushEvent('zoom',{scale:state.imageTransform.scale})},{passive:false});update()}
  function imageDistance(){const p=[...state.imagePointers.values()];return p.length<2?1:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}
  function setupSolutionGestures(selector){const img=$(selector||'#solutionImage');if(!img||img.dataset.bound)return;img.dataset.bound='1';let start=0;img.addEventListener('wheel',e=>{e.preventDefault();start=Math.max(.7,Math.min(3,start+(e.deltaY<0?.1:-.1)));img.style.transform='scale('+(1+start)+')';img.style.transformOrigin='center top'},{passive:false})}
  function downloadJSON(data,filename){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function profileExportStamp(){const d=new Date();const two=n=>String(n).padStart(2,'0');return String(d.getFullYear()).slice(-2)+two(d.getMonth()+1)+two(d.getDate())+'_'+two(d.getHours())+two(d.getMinutes())}
  function profileExportPayload(){return{profile:clone(state.profile),sessions:[clone(state.session)],items_meta:state.items.map(item=>({item_id:item.item_id,unit:item.unit,exam_label:item.exam_label,no:item.no,answer:item.answer}))}}
  function exportProfileJSON(){const student=String(state.session?.student||state.profile?.student||'student').replace(/[\\/?%*:|"<>]/g,'_');downloadJSON(profileExportPayload(),'probstat_profile_'+student+'_'+profileExportStamp()+'.json')}
  function exportJSON(){exportProfileJSON()}
  function openSettings(){const modal=document.createElement('div');modal.className='modal-backdrop';modal.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><h2 id="settingsTitle">설정</h2><p class="quiet">학생 이름: '+esc(state.session?.student||'')+'</p><p class="quiet">현재 세션: '+esc(state.session?.session_id||'')+'</p><div class="modal-actions"><button id="profileExportBtn" class="secondary">상세 분석용 데이터 내보내기</button><button class="danger logout-button">나가기</button><button id="closeModal">닫기</button></div></section>';document.body.appendChild(modal);$('#closeModal',modal).addEventListener('click',()=>modal.remove());$('#profileExportBtn',modal).addEventListener('click',()=>{exportProfileJSON();modal.remove()});$('.logout-button',modal).addEventListener('click',async()=>{if(state.currentRecord){closeCurrent();await persistCurrent(false)}releaseSecureUrls();sessionStorage.removeItem('probstat_content_key');sessionStorage.removeItem('probstat_content_role');secure.key=null;secure.manifest=null;localStorage.removeItem('probstat_pad_student');localStorage.removeItem('probstat_pad_session_flag');localStorage.removeItem('probstat_pad_session_id');state.session=null;state.profile=null;state.current=null;state.currentRecord=null;modal.remove();renderGate('')});modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()})}
  async function syncNow(){if(!CONFIG.syncUrl||!state.session||(!state.dirty.size&&!state.session.session_report&&!state.profileDirty))return;const items=[...state.dirty.values()];setStatus('전송 중 '+items.length+'건');try{const r=await fetch(String(CONFIG.syncUrl).replace(/\/$/,'')+'/api/log',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CONFIG.passHash},body:JSON.stringify({session:{session_id:state.session.session_id,student:state.session.student,started_at:state.session.started_at,user_agent:state.session.user_agent,session_report:state.session.session_report,study_sessions:state.session.study_sessions||[]},profile:clone(state.profile),items})});if(!r.ok)throw Error('sync');items.forEach(x=>state.dirty.delete(x.item_id));state.profileDirty=false;setStatus(state.dirty.size?'전송 대기 '+state.dirty.size+'건':'저장됨')}catch(e){setStatus('전송 대기 '+state.dirty.size+'건')}}
  document.addEventListener('click',e=>{const ratingButton=e.target.closest&&e.target.closest('.rating-button');if(ratingButton&&state.currentRecord){updateProfileFromRecord(state.current,state.currentRecord);}if(e.target.closest&&e.target.closest('#toolToggle'))fitSolveControls();});
  function onVisibility(){if(!state.currentRecord)return;pushEvent(document.hidden?'visibility_hidden':'visibility_visible',{});persistCurrent(true);if(document.hidden)syncNow()}
  document.addEventListener('visibilitychange',onVisibility);setInterval(syncNow,30000);
  async function boot(){const saved=localStorage.getItem('probstat_pad_student')||'';if(saved&&localStorage.getItem('probstat_pad_session_flag')==='1'&&await restoreContent('student')){state.items=await loadItems();await initSession(saved);renderToday()}else renderGate('')}
  window.PROBSTAT_DEBUG={computeStuck,formatSeconds,DEFAULT_ITEMS,buildSessionQueue,STUDY_MATERIALS,emptyProfile,normalizeProfile,recomputeWeakRanking,applyProfileResult};
  boot().catch(e=>appError(e.message||'초기화에 실패했습니다.'));
})();
</script>
